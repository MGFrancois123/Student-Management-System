
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | StudentHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(120deg, #eaf2fa, #f5f8fc);
            color: #172554;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0,0,0,.05);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #123b72;
        }

        .logo span {
            color: #0ea5a4;
        }

        header a {
            text-decoration: none;
            color: #123b72;
            font-weight: 600;
        }

        .registration-container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 18px;
        }

        .registration-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(15,23,42,.08);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading .icon {
            background: #e0f7f4;
            color: #0d9488;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border-radius: 15px;
            margin: 0 auto 15px;
        }

        .heading h1 {
            color: #123b72;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
        }

        .section-title {
            color: #123b72;
            font-size: 17px;
            margin: 25px 0 17px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dbe3ed;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #0ea5a4;
            box-shadow: 0 0 0 3px rgba(14,165,164,.1);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: #64748b;
            font-size: 13px;
            margin: 10px 0 22px;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0ea5a4;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0d9488;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }

        .login-link a {
            color: #0d9488;
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .registration-card {
                padding: 25px 18px;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Student<span>Hub.</span></div>
    <a href="index.html">← Back to Home</a>
</header>

<main class="registration-container">

    <div class="registration-card">

        <div class="heading">
            <div class="icon">🎓</div>
            <h1>Create Student Account</h1>
            <p>Register to become part of the StudentHub platform.</p>
        </div>

        <form action="#" method="post">

            <h3 class="section-title">Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName"
                           placeholder="Enter first name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName"
                           placeholder="Enter last name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="+250 7XX XXX XXX" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

            </div>

            <h3 class="section-title">Academic Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId"
                           placeholder="Enter student ID" required>
                </div>

                <div class="form-group">
                    <label for="programme">Programme</label>
                    <select id="programme" name="programme" required>
                        <option value="">Select Programme</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Software Engineering">Software Engineering</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Networking">Networking</option>
                        <option value="Business Information Technology">Business Information Technology</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="year">Academic Year</label>
                    <select id="year" name="year" required>
                        <option value="">Select Academic Year</option>
                        <option value="Year 1">Year 1</option>
                        <option value="Year 2">Year 2</option>
                        <option value="Year 3">Year 3</option>
                        <option value="Year 4">Year 4</option>
                    </select>
                </div>

            </div>

            <h3 class="section-title">Account Security</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Create password"
                           minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Confirm password"
                           minlength="8" required>
                </div>

            </div>

            <label class="terms">
                <input type="checkbox" required>
                <span>I agree to the terms and conditions of StudentHub.</span>
            </label>

            <button type="submit">Create Account →</button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </div>

    </div>

</main>

<footer>
    © 2026 StudentHub. All Rights Reserved.
</footer>

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", function(event) {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            event.preventDefault();
            alert("Passwords do not match. Please try again.");
        } else {
            event.preventDefault();
            alert("Registration form validated! Backend registration is not connected yet.");
        }
    });
</script>

</body>
</html>
